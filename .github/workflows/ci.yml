name: CI

# 每次 push / PR 做格式、编译与单测检查；安装包归 release.yml。
#
# 矩阵跑 ubuntu 与 windows：
#   - ubuntu 负责格式检查（rustfmt 只在一边跑，避免两边对同一份 diff 报两次）与
#     Linux 上的可移植性（gpui 在 Linux 走 Wayland/X11 分支，编译路径和 Windows 不同）；
#   - windows 是发布主平台，保证干净克隆里也能编过。
#   - macOS 只在 release.yml 里构建，CI 不占 macOS runner 的额度。

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # gpui 在 Linux 上要 pkg-config 找到 xkbcommon / fontconfig 等；
      # 运行期依赖 Wayland 或 X11，构建期只需要开发头文件。
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: 格式检查
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: 编译
        run: cargo build --workspace

      - name: 单元测试
        run: cargo test --workspace
