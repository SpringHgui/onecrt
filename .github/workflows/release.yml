name: Release

# 打 tag `v*` 时为三平台出安装包并建 GitHub Release；
# 手动 workflow_dispatch 只构建并上传 workflow artifacts，不建 Release。
#
# 版本号唯一数据源是 rust/Cargo.toml 的 [workspace.package] version，
# meta job 会校验 tag 与它一致。
#
# 产物：
#   onecrt-<ver>-windows-x64-setup.exe    Inno Setup 安装包
#   onecrt-<ver>-linux-x64.deb            Debian 安装包
#   onecrt-<ver>-macos-arm64.dmg          macOS DMG 安装包
#   SHA256SUMS.txt
#
# 未做代码签名（Windows 无证书、macOS 无公证），首启会遇 SmartScreen / Gatekeeper 提示。
# 应用内的「检查更新」只核对 GitHub Releases 的最新版本并给下载页，不自动替换二进制；
# 更新方式就是下载新包覆盖旧文件后重启。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          set -euo pipefail
          v="$(grep -m1 '^version = ' rust/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$v" ]; then
            echo "读不到 rust/Cargo.toml 的 workspace version"; exit 1
          fi
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != "v$v" ]]; then
            echo "tag ${{ github.ref_name }} 与版本 v$v 不一致，请对齐后重新打 tag"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本号: $v"

  build-windows:
    name: Windows x64 安装包
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: 构建
        run: cargo build --release -p onecrt

      - name: 准备 Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # 简体中文语言文件不再在这儿找：Inno Setup 6 里它还是 unofficial 翻译，官方安装包
          # 只装 Files\Languages\*.isl（7 才把它转正），所以镜像里和手动装的 6.x 都不会带它。
          # 现在随仓库走：rust\installer\languages\ChineseSimplified.isl，onecrt.iss 用相对路径引用。
          #
          # 2026-03 起 jrsoftware 把二进制全部挪到 GitHub Release（issrc 仓库），
          # download.php/is.exe 现在 302 到一个 HTML 下载列表页。照旧 Invoke-WebRequest
          # 存成 .exe 再 Start-Process，Windows 只会报「文件或目录损坏且无法读取」——
          # 装的其实是 11KB 网页。所以优先用 runner 镜像自带的 Inno Setup，
          # 只在它缺失时按固定版本 + 校验和下载真二进制。
          $pinUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          $pinSize = 10604576
          $pinSha256 = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'

          function Find-Iscc {
            # 镜像里装的在哪由镜像说了算（6.x 常见于 Program Files (x86)，7.x 在 Program Files），
            # 所以按目录通配找，别再硬编码某个具体路径。
            Get-ChildItem $env:ProgramFiles, "${env:ProgramFiles(x86)}" -Directory -Filter 'Inno Setup *' -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          function Report-Iscc([string]$Path) {
            $v = (Get-Item $Path).VersionInfo.ProductVersion
            Write-Host "ISCC.exe $v：$Path"
          }

          $iscc = Find-Iscc
          if ($iscc) {
            Write-Host "使用 runner 自带的 Inno Setup"
            Report-Iscc $iscc
          } else {
            Write-Host "镜像里没有 Inno Setup，下载并安装 pinned 6.7.4"
            $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            Invoke-WebRequest -Uri $pinUrl -OutFile $installer -UseBasicParsing

            $size = (Get-Item $installer).Length
            if ($size -ne $pinSize) {
              throw "下载到的 innosetup 大小不对：期望 $pinSize 字节，实际 $size 字节（多半又是拿回 HTML 而不是二进制）"
            }
            $head = New-Object byte[] 2
            $fs = [System.IO.File]::OpenRead($installer); $null = $fs.Read($head, 0, 2); $fs.Close()
            if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) {
              $magic = [System.Text.Encoding]::ASCII.GetString($head)
              throw "下载结果不是 PE 可执行文件（文件头是 '$magic'），jrsoftware 的发布地址或文件名大概又变了：$pinUrl"
            }
            $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $pinSha256) {
              throw "innosetup-6.7.4.exe 校验和不匹配：$hash（应为 $pinSha256）"
            }

            $proc = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "Inno Setup 静默安装失败，退出码 $($proc.ExitCode)"
            }

            $iscc = Find-Iscc
            if (-not $iscc) { throw "装完仍找不到 ISCC.exe" }
            Report-Iscc $iscc
          }

          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 生成安装包
        shell: pwsh
        run: |
          # 复用本地构建脚本，避免 CI 与本地的 staging / ISCC 查找逻辑各写一份而漂移。
          # 它自己从 rust/Cargo.toml 读版本号（meta job 已校验 tag 与之一致）。
          & "$env:GITHUB_WORKSPACE/rust/installer/build-installer.ps1" -SkipBuild -Iscc $env:ISCC
          if (-not $?) { throw 'build-installer.ps1 执行失败' }
          Get-ChildItem target/installer -Filter '*.exe' | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: onecrt-windows-x64-setup
          path: rust/target/installer/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux x64 安装包
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: 构建
        run: cargo build --release -p onecrt

      - name: 打包 DEB
        run: |
          set -euo pipefail
          ver="${{ needs.meta.outputs.version }}"
          pkg="onecrt_$ver-1_amd64"
          rm -rf "$pkg" ../release
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/bin" "$pkg/usr/share/applications" "$pkg/usr/share/icons/hicolor/256x256/apps"
          
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: onecrt
          Version: $ver-1
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: SpringHgui <gui.h@example.com>
          Homepage: https://github.com/SpringHgui/onecrt
          Description: OneCRT - Cross-platform SSH terminal
           Pure Rust implementation of a cross-platform SSH terminal with SFTP support.
          EOF
          
          cp target/release/onecrt "$pkg/usr/bin/"
          chmod 755 "$pkg/usr/bin/onecrt"
          
          cat > "$pkg/usr/share/applications/onecrt.desktop" <<EOF
          [Desktop Entry]
          Name=OneCRT
          Comment=SSH Terminal
          Exec=onecrt
          Icon=onecrt
          Terminal=false
          Type=Application
          Categories=System;TerminalEmulator;
          EOF
          
          if [ -f onecrt/assets/logo.png ]; then
            cp onecrt/assets/logo.png "$pkg/usr/share/icons/hicolor/256x256/apps/onecrt.png"
          fi
          
          dpkg-deb --build "$pkg"
          mkdir -p ../release
          mv "$pkg.deb" "../release/onecrt-$ver-linux-x64.deb"
          ls -lh ../release/

      - uses: actions/upload-artifact@v4
        with:
          name: onecrt-linux-x64-deb
          path: release/*.deb
          if-no-files-found: error

  build-macos:
    name: macOS Apple Silicon 安装包
    needs: meta
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: 构建
        run: cargo build --release -p onecrt

      - name: 打包 .app
        run: |
          set -euo pipefail
          ver="${{ needs.meta.outputs.version }}"
          app="OneCRT.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/onecrt "$app/Contents/MacOS/OneCRT"
          cp onecrt/assets/icon.icns "$app/Contents/Resources/icon.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OneCRT</string>
            <key>CFBundleDisplayName</key><string>OneCRT</string>
            <key>CFBundleIdentifier</key><string>com.sprin.shellx</string>
            <key>CFBundleVersion</key><string>$ver</string>
            <key>CFBundleShortVersionString</key><string>$ver</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>OneCRT</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

      - name: 生成 DMG
        run: |
          set -euo pipefail
          ver="${{ needs.meta.outputs.version }}"
          dmg="onecrt-$ver-macos-arm64.dmg"
          rm -f "$dmg"
          hdiutil create -volname "OneCRT" -srcfolder "OneCRT.app" -ov -format UDZO "$dmg"
          ls -lh "$dmg"
          mkdir -p ../release
          mv "$dmg" ../release/

      - uses: actions/upload-artifact@v4
        with:
          name: onecrt-macos-arm64-dmg
          path: release/*.dmg
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [meta, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: onecrt-*
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum onecrt-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OneCRT ${{ needs.meta.outputs.version }}
          body: |
            OneCRT ${{ needs.meta.outputs.version }}（纯 Rust / gpui 重写版）三平台安装包：

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows x64 | `onecrt-${{ needs.meta.outputs.version }}-windows-x64-setup.exe` | Inno Setup 安装包 |
            | Linux x64 | `onecrt-${{ needs.meta.outputs.version }}-linux-x64.deb` | Debian 包，`sudo dpkg -i` 安装 |
            | macOS arm64 | `onecrt-${{ needs.meta.outputs.version }}-macos-arm64.dmg` | 双击挂载拖入 Applications |

            未做代码签名（首启有 SmartScreen / Gatekeeper 提示）。
            应用内「关于 → 检查更新」只提示新版本并打开本页，不自动安装。
          generate_release_notes: true
          files: artifacts/*
