name: Release

# 打 tag `v*` 时为三平台出便携包并建 GitHub Release；
# 手动 workflow_dispatch 只构建并上传 workflow artifacts，不建 Release。
#
# 版本号唯一数据源是 rust/Cargo.toml 的 [workspace.package] version，
# meta job 会校验 tag 与它一致。
#
# 产物（都是免安装的压缩包，解开就能跑）：
#   onecrt-<ver>-windows-x64.zip        onecrt.exe
#   onecrt-<ver>-linux-x64.tar.gz       onecrt（需要系统装好 Wayland/X11 与字体配置）
#   onecrt-<ver>-macos-arm64.zip        OneCRT.app（未签名，首启要过 Gatekeeper）
#   SHA256SUMS.txt
#
# 未做代码签名（Windows 无证书、macOS 无公证），首启会遇 SmartScreen / Gatekeeper 提示。
# 应用内的「检查更新」只核对 GitHub Releases 的最新版本并给下载页，不自动替换二进制；
# 更新方式就是下载新包覆盖旧文件后重启。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          set -euo pipefail
          v="$(grep -m1 '^version = ' rust/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$v" ]; then
            echo "读不到 rust/Cargo.toml 的 workspace version"; exit 1
          fi
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" != "v$v" ]]; then
            echo "tag ${{ github.ref_name }} 与版本 v$v 不一致，请对齐后重新打 tag"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "版本号: $v"

  build-windows:
    name: Windows x64
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: 构建
        run: cargo build --release -p onecrt

      - name: 打包
        shell: pwsh
        run: |
          $ver = "${{ needs.meta.outputs.version }}"
          New-Item -ItemType Directory -Force ../release | Out-Null
          Copy-Item target/release/onecrt.exe ../release/onecrt.exe
          Compress-Archive -Path ../release/onecrt.exe -DestinationPath "../release/onecrt-$ver-windows-x64.zip"
          Remove-Item ../release/onecrt.exe
          Get-Item "../release/onecrt-$ver-windows-x64.zip" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: onecrt-windows-x64
          path: release/onecrt-*
          if-no-files-found: error

  build-linux:
    name: Linux x64
    needs: meta
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libzstd-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: 构建
        run: cargo build --release -p onecrt

      - name: 打包
        run: |
          set -euo pipefail
          ver="${{ needs.meta.outputs.version }}"
          mkdir -p ../release
          tar -czf "../release/onecrt-$ver-linux-x64.tar.gz" -C target/release onecrt
          du -h ../release/*

      - uses: actions/upload-artifact@v4
        with:
          name: onecrt-linux-x64
          path: release/onecrt-*
          if-no-files-found: error

  build-macos:
    name: macOS Apple Silicon
    needs: meta
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: 构建
        run: cargo build --release -p onecrt

      - name: 打包 .app
        run: |
          set -euo pipefail
          ver="${{ needs.meta.outputs.version }}"
          app="OneCRT.app"
          rm -rf "$app" ../release
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" ../release
          cp target/release/onecrt "$app/Contents/MacOS/OneCRT"
          cp onecrt/assets/icon.icns "$app/Contents/Resources/icon.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OneCRT</string>
            <key>CFBundleDisplayName</key><string>OneCRT</string>
            <key>CFBundleIdentifier</key><string>com.sprin.shellx</string>
            <key>CFBundleVersion</key><string>$ver</string>
            <key>CFBundleShortVersionString</key><string>$ver</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>OneCRT</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          zip -qry "../release/onecrt-$ver-macos-arm64.zip" "$app"
          du -h ../release/*

      - uses: actions/upload-artifact@v4
        with:
          name: onecrt-macos-arm64
          path: release/onecrt-*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [meta, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: onecrt-*
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum onecrt-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OneCRT ${{ needs.meta.outputs.version }}
          body: |
            OneCRT ${{ needs.meta.outputs.version }}（纯 Rust / gpui 重写版）三平台便携包：

            | 平台 | 文件 |
            | --- | --- |
            | Windows x64 | `onecrt-${{ needs.meta.outputs.version }}-windows-x64.zip` |
            | Linux x64 | `onecrt-${{ needs.meta.outputs.version }}-linux-x64.tar.gz` |
            | macOS arm64 | `onecrt-${{ needs.meta.outputs.version }}-macos-arm64.zip` |

            解压即用，未做代码签名（首启有 SmartScreen / Gatekeeper 提示）。
            应用内「关于 → 检查更新」只提示新版本并打开本页，不自动安装。
          generate_release_notes: true
          files: artifacts/*
