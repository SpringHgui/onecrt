[package]
name = "onecrt-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "OneCRT core: saved sessions, SSH, SFTP, importers and the MCP server (UI-agnostic)"

[dependencies]
anyhow = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.61", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "net", "fs"] }
roxmltree = "0.20"

# 导入 SecureCRT 时解密 `Password V2`（`02:` = AES-256-CBC + SHA256 口令派生）
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
sha2 = "0.10"

# MCP 服务：把已存会话开成 Streamable HTTP 的 MCP server，只监听回环
rmcp = { version = "3.7", features = ["transport-streamable-http-server"] }
axum = "0.8"
tokio-util = "0.7"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography"] }

[dev-dependencies]
rmcp = { version = "3.7", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
