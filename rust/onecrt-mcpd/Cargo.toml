[package]
name = "onecrt-mcpd"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "OneCRT MCP background server - serves saved SSH sessions to external agents without the GUI"

[[bin]]
name = "onecrt-mcpd"
path = "src/main.rs"

[dependencies]
onecrt-core = { path = "../onecrt-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
