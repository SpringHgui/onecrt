[package]
name = "onecrt"
version = "0.2.1"
description = "OneCRT - a cross-platform SSH2 terminal client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "onecrt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.61", default-features = false, features = ["ring", "flate2", "rsa"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "net", "fs"] }
anyhow = "1"
dirs = "6"
russh-sftp = "3.0.1"
arboard = "3.6"
rfd = "0.15"
roxmltree = "0.20"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 导入 SecureCRT 时解密 `Password V2`（`02:` = AES-256-CBC + SHA256 口令派生）。
# 用 RustCrypto 家族而非 ring：ring 出于合规刻意不暴露 AES-CBC 原语。纯 Rust，三平台可编。
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
sha2 = "0.10"

# MCP 服务：把已存会话开成 Streamable HTTP 的 MCP server，只监听回环。
# rmcp 默认带 server + macros；服务端传输要自己开。
rmcp = { version = "3.7", features = ["transport-streamable-http-server"] }
axum = "0.8"
tokio-util = "0.7"
getrandom = "0.3"

[dev-dependencies]
# MCP 协议层测试用 rmcp 自带的客户端真跑一次握手，不手写 JSON-RPC
rmcp = { version = "3.7", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false }
# 上游（tauri-plugin-updater）把 reqwest 的 rustls 编成了 no-provider 档，
# reqwest::Client::new() 会因为没有默认加密 provider 直接 panic；测试里显式装一个 ring 的。
# 只用 ring：aws-lc-rs 在 Windows 上要 NASM。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# DPAPI 只在 Windows 上有；不门控的话 Linux/macOS 构建会去编译 windows → windows-future，
# 后者在非 Windows 目标上过不了编译（CI 首轮就是这里红的）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
