[package]
name = "shellx"
version = "0.1.0"
description = "ShellX - a cross-platform SSH2 terminal client"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shellx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.61", default-features = false, features = ["ring", "flate2", "rsa"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "net", "fs"] }
anyhow = "1"
dirs = "6"
russh-sftp = "3.0.1"
arboard = "3.6"
rfd = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# DPAPI 只在 Windows 上有；不门控的话 Linux/macOS 构建会去编译 windows → windows-future，
# 后者在非 Windows 目标上过不了编译（CI 首轮就是这里红的）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
